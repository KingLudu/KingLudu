<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1035"/>
      <stop offset="100%" stop-color="#0a0518"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect x="24" y="24" width="464" height="464" rx="90" fill="none" stroke="url(#goldGrad)" stroke-width="8" opacity="0.6"/>
  <!-- Crown & Dice / Ludo Icon -->
  <g transform="translate(256, 210)">
    <!-- Crown -->
    <path d="M-90,-60 L-70,20 L70,20 L90,-60 L30,-15 L0,-70 L-30,-15 Z" fill="url(#goldGrad)"/>
    <circle cx="-90" cy="-60" r="10" fill="#fef08a"/>
    <circle cx="0" cy="-70" r="12" fill="#fef08a"/>
    <circle cx="90" cy="-60" r="10" fill="#fef08a"/>
    <circle cx="-40" cy="10" r="6" fill="#ef4444"/>
    <circle cx="0" cy="10" r="7" fill="#3b82f6"/>
    <circle cx="40" cy="10" r="6" fill="#22c55e"/>
  </g>
  <!-- 4 Colored Pawn circles at bottom -->
  <g transform="translate(256, 350)">
    <circle cx="-100" cy="0" r="32" fill="#ef4444" stroke="#ffffff" stroke-width="5"/>
    <circle cx="-33" cy="0" r="32" fill="#22c55e" stroke="#ffffff" stroke-width="5"/>
    <circle cx="33" cy="0" r="32" fill="#eab308" stroke="#ffffff" stroke-width="5"/>
    <circle cx="100" cy="0" r="32" fill="#3b82f6" stroke="#ffffff" stroke-width="5"/>
  </g>
  <!-- Text King Ludo -->
  <text x="256" y="445" text-anchor="middle" fill="#fef08a" font-family="system-ui, sans-serif" font-weight="900" font-size="38" letter-spacing="4">KING LUDO</text>
</svg>
